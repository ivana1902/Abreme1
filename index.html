<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Girasoles del universo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg1: #0f1024;
        --bg2: #1b1636;
        --bg3: #241d4d;
        --gold: #ffd558;
        --gold-strong: #ffb703;
        --gold-soft: #fff1a8;
        --leaf: #82d45d;
        --leaf-dark: #3a8d2e;
        --card-front: rgba(255, 248, 214, 0.14);
        --card-back: rgba(24, 20, 38, 0.86);
        --text: #fff8d9;
        --text-dark: #3b2a03;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at 50% 30%, rgba(255, 204, 92, 0.22), transparent 20%),
          radial-gradient(circle at 50% 100%, rgba(129, 84, 255, 0.26), transparent 30%),
          linear-gradient(135deg, var(--bg1), var(--bg2) 40%, var(--bg3));
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.8) 0, transparent 100%),
          radial-gradient(2px 2px at 20% 70%, rgba(255,255,255,0.7) 0, transparent 100%),
          radial-gradient(2px 2px at 70% 30%, rgba(255,255,255,0.8) 0, transparent 100%),
          radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.7) 0, transparent 100%),
          radial-gradient(2px 2px at 40% 50%, rgba(255,255,255,0.7) 0, transparent 100%);
        opacity: 0.9;
        pointer-events: none;
      }

      .scene {
        position: relative;
        perspective: 2200px;
      }

      .card {
        position: relative;
        width: min(88vw, 430px);
        height: 560px;
        transform-style: preserve-3d;
        transition: transform 1.1s cubic-bezier(.2,.8,.2,1);
        cursor: pointer;
      }

      .card.open {
        transform: rotateY(-160deg) rotateX(8deg);
      }

      .face {
        position: absolute;
        inset: 0;
        border-radius: 32px;
        backface-visibility: hidden;
        overflow: hidden;
      }

      .front {
        background:
          linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05)),
          radial-gradient(circle at top, rgba(255,230,120,0.36), rgba(255,255,255,0) 35%),
          linear-gradient(135deg, rgba(255,189,25,0.24), rgba(18,14,30,0.14));
        border: 1px solid rgba(255,255,255,0.22);
        box-shadow: 0 30px 80px rgba(10, 10, 20, 0.5);
        padding: 28px 24px 26px;
      }

      .front::before,
      .front::after {
        content: "";
        position: absolute;
        height: 220px;
        width: 220px;
        border-radius: 50%;
        background: rgba(255, 214, 58, 0.2);
        filter: blur(24px);
      }

      .front::before {
        top: -90px;
        left: -40px;
      }

      .front::after {
        bottom: -80px;
        right: -30px;
      }

      .chip {
        position: relative;
        z-index: 1;
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        color: #fff4b3;
        border: 1px solid rgba(255,255,255,0.18);
      }

      .mini-flower {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 18px auto 18px;
        animation: float 4s ease-in-out infinite;
      }

      .mini-flower .dot {
        position: absolute;
        inset: 50% auto auto 50%;
        width: 58px;
        height: 58px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff8d0 0%, #ffe68f 15%, #f7ba00 42%, #d88e00 100%);
        box-shadow: 0 0 18px rgba(255, 203, 62, 0.8);
      }

      .mini-flower .petal {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 24px;
        height: 58px;
        margin-left: -12px;
        margin-top: -29px;
        border-radius: 60% 60% 58% 58%;
        background: linear-gradient(180deg, #fff9ca, #ffd84e 40%, #efad00 100%);
        transform-origin: center 90%;
      }

      .mini-flower .petal:nth-child(2) { transform: rotate(0deg) translateY(-54px); }
      .mini-flower .petal:nth-child(3) { transform: rotate(30deg) translateY(-54px); }
      .mini-flower .petal:nth-child(4) { transform: rotate(60deg) translateY(-54px); }
      .mini-flower .petal:nth-child(5) { transform: rotate(90deg) translateY(-54px); }
      .mini-flower .petal:nth-child(6) { transform: rotate(120deg) translateY(-54px); }
      .mini-flower .petal:nth-child(7) { transform: rotate(150deg) translateY(-54px); }
      .mini-flower .petal:nth-child(8) { transform: rotate(180deg) translateY(-54px); }
      .mini-flower .petal:nth-child(9) { transform: rotate(210deg) translateY(-54px); }
      .mini-flower .petal:nth-child(10) { transform: rotate(240deg) translateY(-54px); }
      .mini-flower .petal:nth-child(11) { transform: rotate(270deg) translateY(-54px); }
      .mini-flower .petal:nth-child(12) { transform: rotate(300deg) translateY(-54px); }
      .mini-flower .petal:nth-child(13) { transform: rotate(330deg) translateY(-54px); }

      .front h2 {
        position: relative;
        z-index: 1;
        margin: 0;
        text-align: center;
        color: var(--text);
        font-family: "Playfair Display", serif;
        font-size: clamp(2.1rem, 4vw, 2.8rem);
        line-height: 1.1;
      }

      .front p {
        position: relative;
        z-index: 1;
        margin: 18px 8px 22px;
        text-align: center;
        color: rgba(255,245,208,0.85);
        font-size: 1rem;
        line-height: 1.6;
      }

      .open-btn {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 15px 18px;
        background: linear-gradient(135deg, #ffe680, #f4b406);
        color: #3d2902;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 18px 26px rgba(244,180,6,0.38);
      }

      .back {
        transform: rotateY(180deg);
        background:
          radial-gradient(circle at 50% 35%, rgba(255,208,75,0.18), transparent 18%),
          radial-gradient(circle at 50% 50%, rgba(255, 178, 0, 0.12), transparent 42%),
          linear-gradient(180deg, rgba(16,15,30,0.78), rgba(25,18,42,0.96));
        border: 1px solid rgba(255,255,255,0.18);
        box-shadow: 0 34px 70px rgba(5,4,18,0.72);
      }

      .galaxy {
        position: absolute;
        inset: -12% -16%;
        overflow: visible;
        filter: drop-shadow(0 0 18px rgba(255, 208, 75, 0.25));
      }

      .galaxy::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 150%;
        height: 150%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 215, 90, 0.18) 0%, rgba(255, 194, 52, 0.05) 24%, rgba(255,255,255,0) 68%);
      }

      .sunflower {
        --size: 28px;
        --x: 0px;
        --y: 0px;
        --scale: 1;
        --delay: 0s;
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--size);
        height: var(--size);
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(var(--scale));
        animation: drift 7s ease-in-out infinite alternate;
        animation-delay: var(--delay);
        opacity: 0.98;
      }

      .sunflower .head {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 100%;
        height: 100%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff6c9 0%, #ffe98d 18%, #ffcb3b 35%, #f0a900 58%, #d88200 100%);
        box-shadow: 0 0 18px rgba(255, 187, 0, 0.75), inset 0 0 10px rgba(145, 88, 0, 0.25);
      }

      .sunflower .head::before {
        content: "";
        position: absolute;
        inset: 16%;
        border-radius: 50%;
        background: repeating-radial-gradient(circle, rgba(116, 71, 0, 0.82) 0 2px, rgba(255, 204, 63, 0.82) 2px 5px);
      }

      .sunflower .petal {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 20%;
        height: 72%;
        margin-left: -10%;
        margin-top: -36%;
        border-radius: 50% 50% 60% 60%;
        background: linear-gradient(180deg, #fff9df 0%, #ffe272 25%, #ffcd37 48%, #f0a500 100%);
        box-shadow: inset 0 -8px 10px rgba(132, 80, 0, 0.18);
        transform-origin: 50% 100%;
      }

      .sunflower .petal:nth-child(1) { transform: rotate(0deg) translateY(-92%); }
      .sunflower .petal:nth-child(2) { transform: rotate(22.5deg) translateY(-92%); }
      .sunflower .petal:nth-child(3) { transform: rotate(45deg) translateY(-92%); }
      .sunflower .petal:nth-child(4) { transform: rotate(67.5deg) translateY(-92%); }
      .sunflower .petal:nth-child(5) { transform: rotate(90deg) translateY(-92%); }
      .sunflower .petal:nth-child(6) { transform: rotate(112.5deg) translateY(-92%); }
      .sunflower .petal:nth-child(7) { transform: rotate(135deg) translateY(-92%); }
      .sunflower .petal:nth-child(8) { transform: rotate(157.5deg) translateY(-92%); }
      .sunflower .petal:nth-child(9) { transform: rotate(180deg) translateY(-92%); }
      .sunflower .petal:nth-child(10) { transform: rotate(202.5deg) translateY(-92%); }
      .sunflower .petal:nth-child(11) { transform: rotate(225deg) translateY(-92%); }
      .sunflower .petal:nth-child(12) { transform: rotate(247.5deg) translateY(-92%); }
      .sunflower .petal:nth-child(13) { transform: rotate(270deg) translateY(-92%); }
      .sunflower .petal:nth-child(14) { transform: rotate(292.5deg) translateY(-92%); }
      .sunflower .petal:nth-child(15) { transform: rotate(315deg) translateY(-92%); }
      .sunflower .petal:nth-child(16) { transform: rotate(337.5deg) translateY(-92%); }

      .sunflower .stem {
        position: absolute;
        left: 50%;
        top: 100%;
        width: 4px;
        height: 34px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #a7eb71, #4fa52f 65%, #336f20 100%);
        border-radius: 999px;
      }

      .sunflower .leaf {
        position: absolute;
        top: 116%;
        width: 14px;
        height: 10px;
        background: linear-gradient(135deg, #d2f58f, var(--leaf));
        border-radius: 70% 0 70% 0;
        box-shadow: inset -5px -6px 8px rgba(0,0,0,0.08);
      }

      .sunflower .leaf.left {
        left: 30%;
        transform: rotate(-24deg);
      }

      .sunflower .leaf.right {
        right: 30%;
        transform: scaleX(-1) rotate(-24deg);
      }

      .center-text {
        position: absolute;
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
        width: min(76%, 330px);
        text-align: center;
        z-index: 2;
      }

      .center-text h3 {
        margin: 0;
        font-family: "Playfair Display", serif;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
        line-height: 1.08;
        color: #fff8d9;
        text-shadow: 0 0 18px rgba(255, 196, 0, 0.5);
      }

      .center-text p {
        margin-top: 12px;
        font-size: 0.8rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,245,217,0.92);
      }

      @keyframes drift {
        0% { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(var(--scale)); }
        100% { transform: translate(calc(-50% + var(--x) + 6px), calc(-50% + var(--y) - 10px)) scale(calc(var(--scale) + 0.06)); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="card" id="card">
        <div class="face front">
          <span class="chip">Primavera</span>

          <div class="mini-flower">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="dot"></div>
          </div>

          <h2>Flores Amarillas</h2>
          <p>Una tarjeta especial para una persona que ilumina todo a su alrededor.</p>
          <button class="open-btn" type="button">Abrir</button>
        </div>

        <div class="face back">
          <div class="galaxy" id="galaxy"></div>
          <div class="center-text">
            <h3>Flores Amarillas para una persona especial</h3>
            <p>Mil soles en un solo abrazo</p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const card = document.getElementById('card');
      const galaxy = document.getElementById('galaxy');
      const openBtn = document.querySelector('.open-btn');

      function createSunflower(index) {
        const flower = document.createElement('div');
        flower.className = 'sunflower';

        const angle = (index / 26) * Math.PI * 2;
        const radius = 120 + (index % 6) * 22;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        const size = 18 + (index % 4) * 7;

        flower.style.setProperty('--x', `${x}px`);
        flower.style.setProperty('--y', `${y}px`);
        flower.style.setProperty('--scale', `${(0.8 + (index % 5) * 0.12).toFixed(2)}`);
        flower.style.setProperty('--delay', `${(index * 0.22).toFixed(2)}s`);
        flower.style.setProperty('--size', `${size}px`);

        flower.innerHTML = `
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="petal"></div>
          <div class="head"></div>
          <div class="stem"></div>
          <div class="leaf left"></div>
          <div class="leaf right"></div>
        `;

        galaxy.appendChild(flower);
      }

      for (let i = 0; i < 26; i++) {
        createSunflower(i);
      }

      openBtn.addEventListener('click', () => {
        card.classList.toggle('open');
      });

      gsap.from('.front', {
        opacity: 0,
        y: 50,
        duration: 1.2,
        ease: 'power3.out'
      });

      gsap.to('.center-text h3', {
        y: -6,
        repeat: -1,
        yoyo: true,
        duration: 2.7,
        ease: 'sine.inOut'
      });
    </script>
  </body>
</html>
